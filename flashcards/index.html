<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-en="Flashcards Game" data-lang-sr="Igra sa karticama">
      Flashcards Game
    </title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Just Another Hand"
      rel="stylesheet"
    />
  </head>
  <body>
    <main-header></main-header>
    <div class="container">
      <h1
        class="title"
        data-lang-en="Flashcards Game"
        data-lang-sr="Igra sa karticama"
      >
        Flashcards Game
      </h1>
      <div id="flashcard">
        <p id="word"></p>
        <p id="translation"></p>
        <button
          onclick="revealTranslation()"
          data-lang-en="Reveal Translation"
          data-lang-sr="Prikaži prevod"
        >
          Reveal Translation
        </button>
        <button
          onclick="nextFlashcard()"
          data-lang-en="Next Card"
          data-lang-sr="Sledeća kartica"
        >
          Next Card
        </button>
      </div>
      <div class="stats-bar">
        <div class="stat-item">
          <span data-lang-en="Session Time:" data-lang-sr="Vreme sesije:"
            >Session Time:</span
          >
          <span id="session-time">0:00</span>
        </div>
        <div class="stat-item">
          <span data-lang-en="Progress:" data-lang-sr="Napredak:"
            >Progress:</span
          >
          <span id="current-progress">1/15</span>
        </div>
      </div>
    </div>

    <main-footer></main-footer>
    <script src="../components.js"></script>
    <script src="app.js"></script>
  </body>
</html>
