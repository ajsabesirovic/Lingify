<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-en="Learning progress" data-lang-sr="Progres u učenju">
      Learning Progress
    </title>
    <link
      href="https://fonts.googleapis.com/css?family=Just Another Hand"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../global.css" />
  </head>
  <body>
    <main-header></main-header>

    <div class="container">
      <h1 data-lang-en="Games Statistics" data-lang-sr="Statistika Igara">
        Games Statistics
      </h1>

      <section class="progress-section">
        <h2 data-lang-en="Word Matching" data-lang-sr="Povezivanje Reči">
          Word Matching
        </h2>
        <div class="stats-grid">
          <div class="stat-card">
            <h3 data-lang-en="Times Played" data-lang-sr="Broj Igranja">
              Times Played
            </h3>
            <p id="games-played" data-lang-en="0" data-lang-sr="0">0</p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Best Time" data-lang-sr="Najbolje Vreme">
              Best Time
            </h3>
            <p id="best-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Worst Time" data-lang-sr="Najgore Vreme">
              Worst Time
            </h3>
            <p id="worst-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Last Played" data-lang-sr="Poslednje Igrano">
              Last Played
            </h3>
            <p id="last-played" data-lang-en="Never" data-lang-sr="Nikada">
              Never
            </p>
          </div>
        </div>
      </section>

      <section class="progress-section">
        <h2 data-lang-en="Flashcards" data-lang-sr="Kartice">Flashcards</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <h3 data-lang-en="Times Played" data-lang-sr="Broj Igranja">
              Times Played
            </h3>
            <p id="cards-games-played" data-lang-en="0" data-lang-sr="0">0</p>
          </div>

          <div class="stat-card">
            <h3 data-lang-en="Best Time" data-lang-sr="Najbolje Vreme">
              Best Time
            </h3>
            <p id="flash-best-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Worst Time" data-lang-sr="Najgore Vreme">
              Worst Time
            </h3>
            <p id="flash-worst-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>

          <div class="stat-card">
            <h3 data-lang-en="Last Played" data-lang-sr="Poslednje Igrano">
              Last Played
            </h3>
            <p id="last-session" data-lang-en="Never" data-lang-sr="Nikada">
              Never
            </p>
          </div>
        </div>
      </section>
      <section class="progress-section">
        <h2 data-lang-en="Quiz" data-lang-sr="Kviz">Quiz</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <h3 data-lang-en="Times Played" data-lang-sr="Broj Igranja">
              Times Played
            </h3>
            <p id="quiz-games-played" data-lang-en="0" data-lang-sr="0">0</p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Best Time" data-lang-sr="Najbolje Vreme">
              Best Time
            </h3>
            <p id="quiz-best-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Worst Time" data-lang-sr="Najgore Vreme">
              Worst Time
            </h3>
            <p id="quiz-worst-time" data-lang-en="--:--" data-lang-sr="--:--">
              --:--
            </p>
          </div>
          <div class="stat-card">
            <h3 data-lang-en="Last Played" data-lang-sr="Poslednje Igrano">
              Last Played
            </h3>
            <p id="quiz-last-played" data-lang-en="Never" data-lang-sr="Nikada">
              Never
            </p>
          </div>
        </div>
      </section>
    </div>

    <main-footer></main-footer>
    <script src="app.js"></script>
    <script src="../components.js"></script>
  </body>
</html>
